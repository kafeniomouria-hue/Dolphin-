<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Δαίδαλος - Αρχαία Ελλάδα</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  body {
    background: #0f1c2e;
    overflow: hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    height: 100dvh;
  }
  #game-container {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 100%;
    max-height: 780px;
    background: #1a2f4a;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ===== UI OVERLAYS ===== */
  .screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(15, 28, 46, 0.92);
    color: #f5e6c8;
    padding: 20px;
    z-index: 10;
  }
  .screen.active {
    display: flex;
  }

  h1 {
    font-size: 36px;
    margin-bottom: 8px;
    text-shadow: 0 3px 8px rgba(0,0,0,0.6);
    letter-spacing: 1px;
  }
  .subtitle {
    font-size: 16px;
    opacity: 0.85;
    margin-bottom: 30px;
  }

  .btn {
    background: linear-gradient(180deg, #c9a66b, #a67c3d);
    color: #2c1810;
    border: none;
    padding: 14px 36px;
    font-size: 20px;
    font-family: inherit;
    font-weight: bold;
    border-radius: 12px;
    margin: 8px 0;
    min-width: 220px;
    cursor: pointer;
    box-shadow: 0 4px 0 #6b4a22, 0 6px 12px rgba(0,0,0,0.4);
    transition: transform 0.1s;
  }
  .btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #6b4a22;
  }
  .btn.secondary {
    background: linear-gradient(180deg, #5a7a9a, #3d5a78);
    color: #e8f0f8;
    box-shadow: 0 4px 0 #2a3f55, 0 6px 12px rgba(0,0,0,0.4);
  }

  .stats {
    display: flex;
    gap: 24px;
    margin: 16px 0 28px;
    font-size: 18px;
  }
  .stat {
    background: rgba(255,255,255,0.08);
    padding: 8px 16px;
    border-radius: 10px;
    border: 1px solid rgba(201,166,107,0.4);
  }

  /* HUD */
  #hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 14px 16px;
    display: none;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 5;
    pointer-events: none;
  }
  #hud.active { display: flex; }
  .hud-item {
    background: rgba(0,0,0,0.45);
    color: #f5e6c8;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 1px 1px 2px #000;
    border: 1px solid rgba(201,166,107,0.5);
  }
  #pause-btn {
    pointer-events: auto;
    background: rgba(0,0,0,0.5);
    border: 2px solid #c9a66b;
    color: #f5e6c8;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Shop */
  .shop-list {
    width: 100%;
    max-height: 380px;
    overflow-y: auto;
    margin: 12px 0;
    padding: 0 8px;
  }
  .shop-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(201,166,107,0.35);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .shop-item.owned {
    border-color: #5ee05e;
  }
  .shop-item.selected {
    background: rgba(201,166,107,0.25);
    border-color: #c9a66b;
  }
  .char-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .char-preview {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #2a4060;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  .char-name {
    font-size: 17px;
    font-weight: bold;
  }
  .char-price {
    font-size: 15px;
    opacity: 0.9;
  }
  .buy-btn {
    background: #c9a66b;
    color: #2c1810;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
  }
  .buy-btn:disabled {
    background: #555;
    color: #aaa;
  }

  .small-text {
    font-size: 13px;
    opacity: 0.7;
    margin-top: 12px;
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div>
      <div class="hud-item" id="score-display">0</div>
      <div class="hud-item" style="margin-top:6px" id="coins-display">🪙 0</div>
    </div>
    <div id="pause-btn">⏸</div>
  </div>

  <!-- START MENU -->
  <div id="menu" class="screen active">
    <h1>ΔΑΊΔΑΛΟΣ</h1>
    <div class="subtitle">Πτήση στην Αρχαία Ελλάδα</div>
    <div class="stats">
      <div class="stat">🏆 <span id="best-score">0</span></div>
      <div class="stat">🪙 <span id="total-coins">0</span></div>
    </div>
    <button class="btn" id="btn-play">Παίξε</button>
    <button class="btn secondary" id="btn-shop">Κατάστημα</button>
  </div>

  <!-- PAUSE -->
  <div id="pause" class="screen">
    <h1>Παύση</h1>
    <button class="btn" id="btn-resume">Συνέχεια</button>
    <button class="btn secondary" id="btn-menu-from-pause">Μενού</button>
  </div>

  <!-- GAME OVER -->
  <div id="gameover" class="screen">
    <h1>Έπεσες!</h1>
    <div class="stats">
      <div class="stat">Σκορ: <span id="final-score">0</span></div>
      <div class="stat">🪙 +<span id="earned-coins">0</span></div>
    </div>
    <button class="btn" id="btn-retry">Ξανά</button>
    <button class="btn secondary" id="btn-menu-from-go">Μενού</button>
  </div>

  <!-- SHOP -->
  <div id="shop" class="screen">
    <h1>Κατάστημα</h1>
    <div class="stat" style="margin-bottom:12px">🪙 <span id="shop-coins">0</span></div>
    <div class="shop-list" id="shop-list"></div>
    <button class="btn secondary" id="btn-back-shop">Πίσω</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Screens
const menuScreen = document.getElementById('menu');
const pauseScreen = document.getElementById('pause');
const gameoverScreen = document.getElementById('gameover');
const shopScreen = document.getElementById('shop');
const hud = document.getElementById('hud');

// Elements
const scoreDisplay = document.getElementById('score-display');
const coinsDisplay = document.getElementById('coins-display');
const bestScoreEl = document.getElementById('best-score');
const totalCoinsEl = document.getElementById('total-coins');
const finalScoreEl = document.getElementById('final-score');
const earnedCoinsEl = document.getElementById('earned-coins');
const shopCoinsEl = document.getElementById('shop-coins');
const shopList = document.getElementById('shop-list');

let W, H;
function resize() {
  const container = document.getElementById('game-container');
  W = container.clientWidth;
  H = container.clientHeight;
  canvas.width = W;
  canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// ========== DATA ==========
const CHARACTERS = [
  { id: 'daedalus', name: 'Δαίδαλος', price: 0, color: '#e8c4a0', wing: '#e8d5a3', free: true },
  { id: 'icarus', name: 'Ίκαρος', price: 50, color: '#f0d0a0', wing: '#f5e0b8' },
  { id: 'hermes', name: 'Ερμής', price: 120, color: '#d4b896', wing: '#c9a66b' },
  { id: 'athena', name: 'Αθηνά', price: 200, color: '#e8dcc8', wing: '#d4c4a8' },
  { id: 'apollo', name: 'Απόλλων', price: 350, color: '#f5e6c8', wing: '#ffd700' },
  { id: 'zeus', name: 'Ζευς', price: 500, color: '#e8e0d0', wing: '#a0c4ff' }
];

let state = 'menu'; // menu, playing, paused, gameover, shop
let bird = { x: 85, y: 0, vy: 0, radius: 20 };
let pipes = [];
let coins = [];
let score = 0;
let sessionCoins = 0;
let frame = 0;

const gravity = 0.42;
const jumpForce = -8.3;
const pipeWidth = 68;
const pipeGap = 175;
const pipeSpeed = 3.15;

// Persistent
let bestScore = parseInt(localStorage.getItem('daedalus_best') || '0');
let totalCoins = parseInt(localStorage.getItem('daedalus_coins') || '0');
let unlocked = JSON.parse(localStorage.getItem('daedalus_unlocked') || '["daedalus"]');
let selectedChar = localStorage.getItem('daedalus_selected') || 'daedalus';

function save() {
  localStorage.setItem('daedalus_best', bestScore);
  localStorage.setItem('daedalus_coins', totalCoins);
  localStorage.setItem('daedalus_unlocked', JSON.stringify(unlocked));
  localStorage.setItem('daedalus_selected', selectedChar);
}

function updateUI() {
  bestScoreEl.textContent = bestScore;
  totalCoinsEl.textContent = totalCoins;
  shopCoinsEl.textContent = totalCoins;
}

// ========== CHARACTERS DRAW ==========
function getChar() {
  return CHARACTERS.find(c => c.id === selectedChar) || CHARACTERS[0];
}

function drawCharacter(x, y, angle = 0) {
  const ch = getChar();
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  // Wings
  ctx.fillStyle = ch.wing;
  ctx.beginPath();
  ctx.ellipse(-18, -2, 22, 11, -0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(8, -6, 20, 10, 0.5, 0, Math.PI * 2);
  ctx.fill();

  // Wing lines
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(-28, -4);
  ctx.lineTo(-8, 0);
  ctx.stroke();

  // Body
  ctx.fillStyle = '#6b4423';
  ctx.beginPath();
  ctx.ellipse(0, 7, 11, 15, 0, 0, Math.PI * 2);
  ctx.fill();

  // Head
  ctx.fillStyle = ch.color;
  ctx.beginPath();
  ctx.arc(0, -12, 11, 0, Math.PI * 2);
  ctx.fill();

  // Hair
  ctx.fillStyle = '#4a3020';
  ctx.beginPath();
  ctx.arc(-1, -15, 9, Math.PI * 1.15, Math.PI * 1.85);
  ctx.fill();

  // Eye
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(4, -13, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(5, -13, 1.7, 0, Math.PI * 2);
  ctx.fill();

  // Special for Zeus (lightning hint)
  if (ch.id === 'zeus') {
    ctx.strokeStyle = '#a0c4ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(14, 2);
    ctx.lineTo(18, 8);
    ctx.lineTo(15, 8);
    ctx.lineTo(20, 16);
    ctx.stroke();
  }

  ctx.restore();
}

// ========== GAME LOGIC ==========
function resetGame() {
  bird.y = H / 2;
  bird.vy = 0;
  pipes = [];
  coins = [];
  score = 0;
  sessionCoins = 0;
  frame = 0;
  scoreDisplay.textContent = '0';
  coinsDisplay.textContent = '🪙 0';
}

function startGame() {
  resetGame();
  state = 'playing';
  showScreen(null);
  hud.classList.add('active');
  bird.vy = jumpForce;
}

function die() {
  state = 'gameover';
  hud.classList.remove('active');

  if (score > bestScore) {
    bestScore = score;
  }
  totalCoins += sessionCoins;
  save();
  updateUI();

  finalScoreEl.textContent = score;
  earnedCoinsEl.textContent = sessionCoins;
  showScreen('gameover');
}

function createPipe() {
  const minY = 95;
  const maxY = H - pipeGap - 140;
  const topH = Math.random() * (maxY - minY) + minY;
  pipes.push({
    x: W + 40,
    top: topH,
    bottom: topH + pipeGap,
    passed: false
  });

  // Chance to spawn coin in the gap
  if (Math.random() < 0.65) {
    coins.push({
      x: W + 40 + pipeWidth / 2,
      y: topH + pipeGap / 2,
      r: 12,
      collected: false
    });
  }
}

function update() {
  if (state !== 'playing') return;

  bird.vy += gravity;
  bird.y += bird.vy;

  if (bird.y + bird.radius > H - 38 || bird.y - bird.radius < 0) {
    die();
    return;
  }

  if (frame % 92 === 0) createPipe();

  // Pipes
  for (let i = pipes.length - 1; i >= 0; i--) {
    const p = pipes[i];
    p.x -= pipeSpeed;

    if (
      bird.x + bird.radius - 5 > p.x &&
      bird.x - bird.radius + 5 < p.x + pipeWidth &&
      (bird.y - bird.radius < p.top || bird.y + bird.radius > p.bottom)
    ) {
      die();
      return;
    }

    if (!p.passed && p.x + pipeWidth < bird.x) {
      p.passed = true;
      score++;
      scoreDisplay.textContent = score;
    }

    if (p.x + pipeWidth < -30) pipes.splice(i, 1);
  }

  // Coins
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.x -= pipeSpeed;

    const dx = bird.x - c.x;
    const dy = bird.y - c.y;
    if (!c.collected && Math.sqrt(dx * dx + dy * dy) < bird.radius + c.r) {
      c.collected = true;
      sessionCoins++;
      coinsDisplay.textContent = '🪙 ' + sessionCoins;
    }

    if (c.x < -20 || c.collected) coins.splice(i, 1);
  }

  frame++;
}

// ========== DRAWING ==========
function drawBackground() {
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#3a6ea5');
  grd.addColorStop(0.55, '#6fa8d4');
  grd.addColorStop(1, '#b8d4e8');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  // Distant temple
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(W * 0.58, H * 0.26, 85, 50);
  for (let i = 0; i < 5; i++) {
    ctx.fillRect(W * 0.58 + 6 + i * 15, H * 0.20, 7, 60);
  }
  ctx.beginPath();
  ctx.moveTo(W * 0.56, H * 0.26);
  ctx.lineTo(W * 0.58 + 42, H * 0.16);
  ctx.lineTo(W * 0.58 + 95, H * 0.26);
  ctx.fill();
}

function drawGround() {
  ctx.fillStyle = '#c9b896';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#b8a78a';
  for (let i = 0; i < W; i += 36) {
    ctx.fillRect(i, H - 38, 18, 6);
  }
}

function drawColumn(x, topH, bottomY) {
  const w = pipeWidth;
  // Top
  ctx.fillStyle = '#f0e6d2';
  ctx.fillRect(x + 8, 0, w - 16, topH - 26);
  ctx.fillStyle = '#e0d0b0';
  ctx.fillRect(x, topH - 26, w, 11);
  ctx.fillStyle = '#d4c4a0';
  ctx.fillRect(x + 3, topH - 15, w - 6, 15);

  // Bottom
  ctx.fillStyle = '#f0e6d2';
  ctx.fillRect(x + 8, bottomY + 26, w - 16, H - bottomY - 38 - 26);
  ctx.fillStyle = '#e0d0b0';
  ctx.fillRect(x, bottomY, w, 11);
  ctx.fillStyle = '#d4c4a0';
  ctx.fillRect(x + 3, bottomY + 11, w - 6, 15);
  ctx.fillRect(x + 2, H - 48, w - 4, 10);

  // Fluting
  ctx.strokeStyle = 'rgba(160,140,100,0.35)';
  ctx.lineWidth = 1.5;
  for (let i = 1; i < 4; i++) {
    const lx = x + 8 + (w - 16) * (i / 4);
    ctx.beginPath();
    ctx.moveTo(lx, 0);
    ctx.lineTo(lx, topH - 26);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(lx, bottomY + 26);
    ctx.lineTo(lx, H - 48);
    ctx.stroke();
  }
}

function drawCoin(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(0, 0, c.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#e6b800';
  ctx.beginPath();
  ctx.arc(0, 0, c.r - 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff8dc';
  ctx.font = 'bold 11px Georgia';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('€', 0, 1);
  ctx.restore();
}

function draw() {
  drawBackground();
  drawGround();

  pipes.forEach(p => drawColumn(p.x, p.top, p.bottom));
  coins.forEach(c => { if (!c.collected) drawCoin(c); });

  if (state === 'playing' || state === 'paused') {
    const angle = Math.min(Math.max(bird.vy * 0.07, -0.55), 0.75);
    drawCharacter(bird.x, bird.y, angle);
  }
}

// ========== SCREENS ==========
function showScreen(name) {
  [menuScreen, pauseScreen, gameoverScreen, shopScreen].forEach(s => s.classList.remove('active'));
  if (name === 'menu') menuScreen.classList.add('active');
  if (name === 'pause') pauseScreen.classList.add('active');
  if (name === 'gameover') gameoverScreen.classList.add('active');
  if (name === 'shop') shopScreen.classList.add('active');
}

function openShop() {
  state = 'shop';
  renderShop();
  showScreen('shop');
  hud.classList.remove('active');
}

function renderShop() {
  shopList.innerHTML = '';
  CHARACTERS.forEach(ch => {
    const owned = unlocked.includes(ch.id);
    const selected = selectedChar === ch.id;
    const div = document.createElement('div');
    div.className = 'shop-item' + (owned ? ' owned' : '') + (selected ? ' selected' : '');
    div.innerHTML = `
      <div class="char-info">
        <div class="char-preview">🪶</div>
        <div>
          <div class="char-name">${ch.name}</div>
          <div class="char-price">${owned ? (selected ? 'Επιλεγμένος' : 'Ξεκλείδωτος') : ch.price + ' 🪙'}</div>
        </div>
      </div>
      <button class="buy-btn" data-id="${ch.id}">
        ${owned ? (selected ? '✓' : 'Επιλογή') : 'Αγορά'}
      </button>
    `;
    shopList.appendChild(div);
  });

  shopList.querySelectorAll('.buy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const ch = CHARACTERS.find(c => c.id === id);
      if (unlocked.includes(id)) {
        selectedChar = id;
        save();
        renderShop();
      } else if (totalCoins >= ch.price) {
        totalCoins -= ch.price;
        unlocked.push(id);
        selectedChar = id;
        save();
        updateUI();
        renderShop();
      }
    });
  });
}

// ========== CONTROLS ==========
function flap() {
  if (state === 'playing') {
    bird.vy = jumpForce;
  }
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state === 'playing') flap();
}, { passive: false });

canvas.addEventListener('mousedown', () => {
  if (state === 'playing') flap();
});

document.getElementById('btn-play').addEventListener('click', startGame);
document.getElementById('btn-shop').addEventListener('click', openShop);
document.getElementById('btn-resume').addEventListener('click', () => {
  state = 'playing';
  showScreen(null);
  hud.classList.add('active');
});
document.getElementById('btn-menu-from-pause').addEventListener('click', () => {
  state = 'menu';
  showScreen('menu');
  hud.classList.remove('active');
  updateUI();
});
document.getElementById('btn-retry').addEventListener('click', startGame);
document.getElementById('btn-menu-from-go').addEventListener('click', () => {
  state = 'menu';
  showScreen('menu');
  updateUI();
});
document.getElementById('btn-back-shop').addEventListener('click', () => {
  state = 'menu';
  showScreen('menu');
  updateUI();
});
document.getElementById('pause-btn').addEventListener('click', () => {
  if (state === 'playing') {
    state = 'paused';
    showScreen('pause');
  }
});

// ========== LOOP ==========
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

updateUI();
loop();
</script>
</body>
</html>
