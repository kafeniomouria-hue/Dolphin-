<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Δαίδαλος - Flappy Bird</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: #1a3a5c;
    overflow: hidden;
    font-family: 'Georgia', serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    height: 100dvh;
  }
  #game-container {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 100%;
    max-height: 750px;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #ui {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 18px;
  }
  #score {
    color: #f5e6c8;
    font-size: 46px;
    font-weight: bold;
    text-shadow: 3px 3px 0 #2c1810, 0 0 12px rgba(0,0,0,0.5);
    text-align: center;
    letter-spacing: 2px;
  }
  #message {
    color: #f5e6c8;
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    text-shadow: 2px 2px 0 #2c1810;
    background: rgba(44, 24, 16, 0.75);
    padding: 18px 16px;
    border-radius: 14px;
    border: 2px solid #c9a66b;
    display: none;
    line-height: 1.45;
  }
  #message.show {
    display: block;
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="score">0</div>
    <div id="message">Πάτα για να πετάξεις<br>σαν τον Δαίδαλο</div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const messageEl = document.getElementById('message');

let W, H;
function resize() {
  const container = document.getElementById('game-container');
  W = container.clientWidth;
  H = container.clientHeight;
  canvas.width = W;
  canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Game objects
let bird = { x: 85, y: 0, vy: 0, radius: 20 };
let pipes = [];
let score = 0;
let best = localStorage.getItem('daedalusBest') || 0;
let gameState = 'start'; // start, playing, dead
let frame = 0;

const gravity = 0.42;
const jump = -8.2;
const pipeWidth = 68;
const pipeGap = 175;
const pipeSpeed = 3.1;

function reset() {
  bird.y = H / 2;
  bird.vy = 0;
  pipes = [];
  score = 0;
  scoreEl.textContent = '0';
  frame = 0;
  gameState = 'start';
  messageEl.innerHTML = 'Πάτα για να πετάξεις<br>σαν τον Δαίδαλο';
  messageEl.classList.add('show');
}

function startGame() {
  if (gameState === 'start' || gameState === 'dead') {
    if (gameState === 'dead') reset();
    gameState = 'playing';
    messageEl.classList.remove('show');
    bird.vy = jump;
  }
}

function flap() {
  if (gameState === 'playing') {
    bird.vy = jump;
  } else {
    startGame();
  }
}

// Controls
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  flap();
}, { passive: false });
canvas.addEventListener('mousedown', flap);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    flap();
  }
});

function createPipe() {
  const minY = 90;
  const maxY = H - pipeGap - 130;
  const topHeight = Math.random() * (maxY - minY) + minY;
  pipes.push({
    x: W + 30,
    top: topHeight,
    bottom: topHeight + pipeGap,
    passed: false
  });
}

function update() {
  if (gameState !== 'playing') return;

  bird.vy += gravity;
  bird.y += bird.vy;

  // Floor / ceiling collision
  if (bird.y + bird.radius > H - 35 || bird.y - bird.radius < 0) {
    die();
  }

  // Spawn columns
  if (frame % 95 === 0) createPipe();

  for (let i = pipes.length - 1; i >= 0; i--) {
    const p = pipes[i];
    p.x -= pipeSpeed;

    // Collision with columns
    if (
      bird.x + bird.radius - 4 > p.x &&
      bird.x - bird.radius + 4 < p.x + pipeWidth &&
      (bird.y - bird.radius < p.top || bird.y + bird.radius > p.bottom)
    ) {
      die();
    }

    // Score
    if (!p.passed && p.x + pipeWidth < bird.x) {
      p.passed = true;
      score++;
      scoreEl.textContent = score;
    }

    if (p.x + pipeWidth < -20) pipes.splice(i, 1);
  }

  frame++;
}

function die() {
  gameState = 'dead';
  if (score > best) {
    best = score;
    localStorage.setItem('daedalusBest', best);
  }
  messageEl.innerHTML = `Έπεσες...<br>Σκορ: ${score}<br>Καλύτερο: ${best}<br><br>Πάτα για να ξαναπετάξεις`;
  messageEl.classList.add('show');
}

// ========== DRAWING ==========

function drawBackground() {
  // Sky gradient (Aegean blue)
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#4a90c8');
  sky.addColorStop(0.6, '#7eb8d4');
  sky.addColorStop(1, '#c5dce8');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Distant temple silhouette
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  // Simple temple shape
  ctx.fillRect(W*0.55, H*0.28, 90, 55);
  // Columns of temple
  for (let i = 0; i < 5; i++) {
    ctx.fillRect(W*0.55 + 8 + i*16, H*0.22, 8, 65);
  }
  // Roof
  ctx.beginPath();
  ctx.moveTo(W*0.53, H*0.28);
  ctx.lineTo(W*0.55 + 45, H*0.18);
  ctx.lineTo(W*0.55 + 100, H*0.28);
  ctx.fill();
}

function drawGround() {
  // Marble ground
  ctx.fillStyle = '#d4c4a8';
  ctx.fillRect(0, H - 35, W, 35);

  // Stone lines
  ctx.strokeStyle = '#b8a78a';
  ctx.lineWidth = 2;
  for (let i = 0; i < W; i += 40) {
    ctx.beginPath();
    ctx.moveTo(i, H - 35);
    ctx.lineTo(i, H);
    ctx.stroke();
  }
  // Top edge
  ctx.fillStyle = '#c9b896';
  ctx.fillRect(0, H - 38, W, 5);
}

function drawColumn(x, topH, bottomY) {
  const w = pipeWidth;

  // ===== TOP COLUMN (upside down) =====
  // Shaft
  ctx.fillStyle = '#f0e6d2';
  ctx.fillRect(x + 8, 0, w - 16, topH - 28);

  // Capital (bottom of top column)
  ctx.fillStyle = '#e8d9b8';
  ctx.fillRect(x, topH - 28, w, 12);
  ctx.fillStyle = '#d4c4a0';
  ctx.fillRect(x + 4, topH - 16, w - 8, 16);

  // Fluting (vertical lines)
  ctx.strokeStyle = 'rgba(180,160,120,0.4)';
  ctx.lineWidth = 1.5;
  for (let i = 1; i < 4; i++) {
    const lx = x + 8 + (w - 16) * (i / 4);
    ctx.beginPath();
    ctx.moveTo(lx, 0);
    ctx.lineTo(lx, topH - 28);
    ctx.stroke();
  }

  // ===== BOTTOM COLUMN =====
  // Shaft
  ctx.fillStyle = '#f0e6d2';
  ctx.fillRect(x + 8, bottomY + 28, w - 16, H - bottomY - 35 - 28);

  // Capital
  ctx.fillStyle = '#e8d9b8';
  ctx.fillRect(x, bottomY, w, 12);
  ctx.fillStyle = '#d4c4a0';
  ctx.fillRect(x + 4, bottomY + 12, w - 8, 16);

  // Base
  ctx.fillStyle = '#d4c4a0';
  ctx.fillRect(x + 2, H - 45, w - 4, 10);

  // Fluting
  for (let i = 1; i < 4; i++) {
    const lx = x + 8 + (w - 16) * (i / 4);
    ctx.beginPath();
    ctx.moveTo(lx, bottomY + 28);
    ctx.lineTo(lx, H - 45);
    ctx.stroke();
  }
}

function drawDaedalus() {
  ctx.save();
  ctx.translate(bird.x, bird.y);

  // Tilt based on velocity
  const angle = Math.min(Math.max(bird.vy * 0.07, -0.55), 0.75);
  ctx.rotate(angle);

  // Wings (behind body)
  ctx.fillStyle = '#e8d5a3';
  // Left wing
  ctx.beginPath();
  ctx.ellipse(-18, -2, 22, 11, -0.4, 0, Math.PI * 2);
  ctx.fill();
  // Right wing
  ctx.beginPath();
  ctx.ellipse(8, -6, 20, 10, 0.5, 0, Math.PI * 2);
  ctx.fill();

  // Wing details
  ctx.strokeStyle = '#c9a66b';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-30, -5);
  ctx.lineTo(-10, 0);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, -10);
  ctx.lineTo(18, -4);
  ctx.stroke();

  // Body (tunic)
  ctx.fillStyle = '#8b5a2b';
  ctx.beginPath();
  ctx.ellipse(0, 6, 12, 16, 0, 0, Math.PI * 2);
  ctx.fill();

  // Head
  ctx.fillStyle = '#e8c4a0';
  ctx.beginPath();
  ctx.arc(0, -12, 11, 0, Math.PI * 2);
  ctx.fill();

  // Hair / beard suggestion
  ctx.fillStyle = '#5c4033';
  ctx.beginPath();
  ctx.arc(-1, -15, 9, Math.PI * 1.1, Math.PI * 1.9);
  ctx.fill();

  // Eye
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(4, -13, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#2c1810';
  ctx.beginPath();
  ctx.arc(5, -13, 1.8, 0, Math.PI * 2);
  ctx.fill();

  // Arm
  ctx.strokeStyle = '#e8c4a0';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(6, 2);
  ctx.lineTo(16, 8);
  ctx.stroke();

  ctx.restore();
}

function draw() {
  drawBackground();
  drawGround();

  // Columns
  pipes.forEach(p => {
    drawColumn(p.x, p.top, p.bottom);
  });

  // Daedalus
  drawDaedalus();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

reset();
loop();
</script>
</body>
</html>
